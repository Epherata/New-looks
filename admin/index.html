<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }
        .login-box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>
    <input id="adminPass" type="password" placeholder="Enter password">
    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const pass = document.getElementById("adminPass").value;

    const correct = "NewLook2025"; // ← change this to your password

    if (pass === correct) {
        localStorage.setItem("adminLoggedIn", "yes");
        window.location.href = "admin/admin.html";
    } else {
        alert("Wrong password!");
    }
}
</script>

</body>
</html>
