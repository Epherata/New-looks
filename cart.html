<!DOCTYPE html>
<html lang="en">
<head>

  
  <meta charset="UTF-8">
  <title>Your Cart | New Look</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
  --bg: #000;
  --text: #f1a887;
  --card-bg: #111;
  --shadow: rgba(255, 215, 0, 0.3);
  --btn-bg: #f1a887;
  --btn-text: black;
}

.light-mode {
  --bg: rgba(255,248,240,0.95);
  --text: #222;
  --card-bg: #f7f7f7;
  --shadow: rgba(0, 0, 0, 0.2);
  --btn-bg: #222;
  --btn-text: white;
}

    /* ===== Base Styles ===== */
    body {
      font-family: "Poppins", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin: 60px 0 20px;
      font-size: 28px;
      color: var(--text);
    }

    /* ===== Back to Shop Button (Top Left Corner) ===== */
    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #f1a887;
      color: black;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: 0.3s;
      z-index: 1000;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .back-btn:hover {
      background: #c77f5d;
    }

    /* ===== Cart Items ===== */
    .cart-item {
      display: flex;
      align-items: center;
      background:var(--card-bg);
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow:  0 0 10px var(--shadow);
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
    }

    .cart-details {
      flex: 1;
      color:  var(--text);
      min-width: 200px;
    }

    .cart-details h4 {
      margin: 0 0 6px;
      font-size: 17px;
      color: #f1a887;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }

    .quantity-controls button {
      background: #f1a887;
      color: black;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .quantity-controls button:hover {
      background: #c77f5d;
    }

    .remove-btn {
      background: transparent;
      border: 1px solid #f1a887;
      color: #f1a887;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }

    .remove-btn:hover {
      background: #f1a887;
      color: black;
    }

    .cart-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .buy-btn {
      background: #f1a887;
      color: black;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: #c77f5d;
    }

    /* ===== Total and Checkout ===== */
    .cart-total {
      text-align: center;
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      color:  var(--text);
    }

    .checkout-btn {
      display: block;
      margin: 25px auto;
      background: #f1a887;
      color: black;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      text-align: center;
      width: fit-content;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }

    .checkout-btn:hover {
      background: #c77f5d;
    }



    /* ===== RESPONSIVE DESIGN ===== */

/* Tablet (<=768px) */
@media (max-width: 768px) {
  h2 {
    font-size: 24px;
    margin-top: 70px;
  }

  .cart-item {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    padding: 18px;
  }

  .cart-item img {
    width: 130px;
    height: 130px;
  }

  .cart-details {
    min-width: unset;
  }

  .cart-actions {
    flex-direction: row;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }

  .quantity-controls {
    justify-content: center;
  }

  .checkout-btn {
    width: 80%;
    font-size: 16px;
  }
}

/* Mobile (<=480px) */
@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  .back-btn {
    font-size: 12px;
    padding: 8px 12px;
  }

  h2 {
    font-size: 22px;
  }

  .cart-item {
    padding: 14px;
    gap: 10px;
  }

  .cart-item img {
    width: 120px;
    height: 120px;
  }

  .cart-details h4 {
    font-size: 15px;
  }

  .cart-actions {
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  .buy-btn,
  .remove-btn {
    width: 85%;
    font-size: 14px;
    padding: 10px 14px;
  }

  .checkout-btn {
    width: 90%;
    font-size: 15px;
    padding: 12px 20px;
  }
}
  </style>

<script>
// GLOBAL cart array


// Function to show alerts
function showAlert(message) {
  alert(message); // Replace with your custom alert if needed
}

// Checkout button click
document.getElementById("checkout-btn").addEventListener("click", function(e) {
  e.preventDefault();

  if (cart.length === 0) {
    showAlert("Your cart is empty!");
    return;
  }

  // Calculate totals
  const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
  const tax = subtotal * 0.05;
  const totalWithTax = subtotal + tax;
  const cartDescription = cart.map(item => `${item.name} x ${item.quantity}`).join(", ");

  // Create popup
  const popup = document.createElement("div");
  popup.innerHTML = `
   <div style="
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.75);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      padding: 10px;
      box-sizing: border-box;
  ">
    <div style="
        background:#111;
        color:#f1a887;
        padding:20px;
        border-radius:20px;
        width:100%;
        max-width:400px;
        max-height:90vh;
        overflow-y:auto;
        text-align:center;
        box-sizing:border-box;
    ">
      <h3 style="margin-top:0;">Your Cart</h3>
        <div id="cart-items-popup" style="text-align:left; margin-bottom:15px;">
          ${cart.map(item => `
            <div style="
              display:flex; align-items:center; background:#1a1a1a; 
              margin-bottom:10px; padding:10px; border-radius:10px;">
              <div style="flex:1;">
                <p style="margin:0; font-weight:bold;">${item.name}</p>
                <p style="margin:2px 0; font-size:14px; color:#ccc;">
                  Qty: ${item.quantity} | $${(item.price*item.quantity).toFixed(2)}
                </p>
              </div>
            </div>
          `).join('')}
        </div>

        <p>Subtotal: $${subtotal.toFixed(2)}</p>
        <p>Tax (5%): $${tax.toFixed(2)}</p>
        <p style="font-weight:bold;">Total: $${totalWithTax.toFixed(2)}</p>

        <div style="margin:15px 0; text-align:left;">
          <label><input type="radio" name="delivery_cart" value="pickup" checked> Pickup</label>
          <label style="margin-left:15px;"><input type="radio" name="delivery_cart" value="delivery"> Delivery</label>
        </div>

        <div id="customer-info-cart" style="text-align:left; margin-bottom:15px;">
          <input type="text" id="name_cart" placeholder="Full Name" style="width:100%; margin-bottom:10px; padding:8px; border-radius:6px; border:none;">
          <input type="tel" id="phone_cart" placeholder="Phone Number" style="width:100%; margin-bottom:10px; padding:8px; border-radius:6px; border:none;">
          <input type="text" id="address_cart" placeholder="Delivery Address" style="width:100%; margin-bottom:10px; padding:8px; border-radius:6px; border:none; display:none;">
        </div>

        <div id="paypal-button-container-cart" style="margin-top:10px;"></div>

        <button id="close_cart" style="margin-top:15px; padding:10px 20px; border-radius:8px; border:2px solid #f1a887; background:transparent; color:#f1a887; cursor:pointer;">
          Cancel
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(popup);

  const addressEl = popup.querySelector("#address_cart");

  // Show/hide address input
  popup.querySelectorAll('input[name="delivery_cart"]').forEach(radio => {
    radio.onchange = () => {
      addressEl.style.display = radio.value === "delivery" ? "block" : "none";
    };
  });

  // Close popup
  popup.querySelector("#close_cart").onclick = () => {
    document.body.removeChild(popup);
  };

  // Render PayPal button
  paypal.Buttons({
    style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'pay' },

    createOrder: function(data, actions) {
      const name = popup.querySelector('#name_cart').value.trim();
      const phone = popup.querySelector('#phone_cart').value.trim();
      const deliveryMethod = popup.querySelector('input[name="delivery_cart"]:checked').value;
      const address = popup.querySelector('#address_cart').value.trim();

      if (!name || !phone || (deliveryMethod === "delivery" && !address)) {
        showAlert("Please fill in all required fields.");
        return;
      }

      return actions.order.create({
        purchase_units: [{
          amount: { value: totalWithTax.toFixed(2) },
          description: `Cart items: ${cartDescription} (${deliveryMethod.toUpperCase()})`
        }]
      });
    },

    onApprove: function(data, actions) {
      return actions.order.capture().then(function(details) {
        const name = popup.querySelector('#name_cart').value.trim();
        const phone = popup.querySelector('#phone_cart').value.trim();
        const deliveryMethod = popup.querySelector('input[name="delivery_cart"]:checked').value;
        const address = popup.querySelector('#address_cart').value.trim();

        const orderData = {
          type: "cart",
          items: cart.map(item => ({ name: item.name, quantity: item.quantity, price: item.price })),
          total: totalWithTax.toFixed(2),
          deliveryType: deliveryMethod,
          customerName: name,
          customerPhone: phone,
          customerAddress: address || "",
          date: new Date().toISOString()
        };

        // Save to Firestore
        db.collection("orders").add(orderData)
          .then(() => {
            console.log("Cart order saved!");

            // CLEAR CART
            cart.length = 0;                  // clear global cart
            localStorage.removeItem("cart");  // clear localStorage
            if (typeof renderCart === "function") renderCart(); // update UI
            window.dispatchEvent(new Event("storage")); // notify other tabs

            showAlert(`Transaction completed by ${details.payer.name.given_name}`);
            if (popup && popup.parentNode) document.body.removeChild(popup);
          })
          .catch(err => {
            console.error("Firestore error:", err);
            showAlert("Order save failed — payment succeeded. Please contact admin.");
          });
      });
    }

  }).render(popup.querySelector("#paypal-button-container-cart"));
});
</script>

          return;
        }

        const totalWithTax = (item.price * qty * 1.05).toFixed(2); // 5% tax

        return actions.order.create({
          purchase_units: [{
            amount: { value: totalWithTax },
            description: `${item.name} x ${qty} (${deliveryMethod.toUpperCase()})`
          }]
        });
      },

      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          const name = popup.querySelector('#name').value.trim();
          const phone = popup.querySelector('#phone').value.trim();
          const deliveryMethod = popup.querySelector('input[name="delivery"]:checked').value;
          const address = popup.querySelector('#address').value.trim();
          const totalWithTax = (item.price * qty * 1.05).toFixed(2);

          // Save to Firestore
          db.collection("orders").add({
            type: "single",
            itemName: item.name,
            quantity: qty,
            total: totalWithTax,
            deliveryType: deliveryMethod,
            customerName: name,
            customerPhone: phone,
            customerAddress: address || "",
            payerEmail: details?.payer?.email_address || "",
            paymentID: details?.id || "",
            date: new Date().toISOString()
          })
          .then(() => console.log("Buy Now order saved"))
          .catch(err => console.error(err));

          showAlert(`Transaction completed by ${details.payer.name.given_name}`);

          // Remove item from cart
          cart.splice(index, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          renderCart();

          // Remove popup
          if (popup.parentNode) document.body.removeChild(popup);
        });
      }

    }).render(container);
  }

  renderPayPal();
}


function attachBuyNowPopup() {
  document.querySelectorAll('.buy-btn').forEach(button => {
    button.addEventListener('click', () => {
       const product = {
        name: button.dataset.name,
        price: parseFloat(button.dataset.price),
        image: button.dataset.image,
        quantity: parseInt(button.dataset.quantity)
      };
      showBuyNowPopup(product);
    });
  });
}



</script>


<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

const cartContainer = document.getElementById('cart-items');
const totalContainer = document.getElementById('cart-total');
const checkoutBtn = document.getElementById('paypal-checkout');


function renderCart() {
  cartContainer.innerHTML = '';
  let total = 0;

  if (cart.length === 0) {
    cartContainer.innerHTML = "<p style='text-align:center;'>Your cart is empty.</p>";
    totalContainer.textContent = '';
    return;
  }

  cart.forEach((item, index) => {
    const subtotal = (item.price || 0) * (item.quantity || 0);
    total += subtotal;

    const div = document.createElement('div');
    div.classList.add('cart-item');
    div.innerHTML = `
      <img src="${item.image}" alt="${item.name}">
      <div class="cart-details">
        <h4>${item.name}</h4>
        <p>Price: $${item.price.toFixed(2)}</p>
        <div class="quantity-controls">
          <button onclick="updateQuantity(${index}, -1)">−</button>
          <span>${item.quantity}</span>
          <button onclick="updateQuantity(${index}, 1)">+</button>
        </div>
        <p>Subtotal: $${subtotal.toFixed(2)}</p>
      </div>
      <div class="cart-actions">
      <button class="buy-btn" 
    data-name="${item.name}" 
    data-price="${item.price}" 
    data-image="${item.image}" 
    data-quantity="${item.quantity}">
  Buy Now
</button>


        <button class="remove-btn" data-index="${index}">Remove</button>
      </div>
    `;
    cartContainer.appendChild(div);
     totalContainer.textContent = `Total: $${total.toFixed(2)}`;
  localStorage.setItem('cart', JSON.stringify(cart));
div.querySelector('.buy-btn').onclick = () => showCartItemBuyNowPopup(item, index);

  });


}

/* Update quantity FROM CART page only — do NOT reorder items here */
function updateQuantity(index, change) {
  index = Number(index);
  cart[index].quantity = (cart[index].quantity || 0) + Number(change);
  if (cart[index].quantity < 1) cart[index].quantity = 1;
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

/* Remove item */
function removeItem(index) {
  index = Number(index);
  cart.splice(index, 1); // remove only the clicked item
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

/* Event delegation for remove buttons */
cartContainer.addEventListener('click', (e) => {
  const rem = e.target.closest('.remove-btn');
  if (rem) {
    const idx = rem.dataset.index;
    removeItem(idx);
  }
});

/* Listen for changes made in other tabs (e.g., index page added item) */
window.addEventListener('storage', (e) => {
  if (e.key === 'cart') {
    cart = JSON.parse(localStorage.getItem('cart')) || [];
    renderCart();
  }
});

/* initial render */
renderCart();
</script>

  function showAlert(message) {
    const alertBox = document.getElementById('custom-alert');
    const alertMsg = document.getElementById('custom-alert-msg');
    const alertOk = document.getElementById('custom-alert-ok');

    alertMsg.textContent = message;
    alertBox.style.display = 'flex';

    alertOk.onclick = () => {
        alertBox.style.display = 'none';
    };
}

<script>
  const modeBtn = document.getElementById("mode-toggle");

  // Load saved mode
  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light-mode");
    modeBtn.textContent = "☀️ Light Mode";
  }

  modeBtn.addEventListener("click", () => {
    document.body.classList.toggle("light-mode");

    // Save setting
    if (document.body.classList.contains("light-mode")) {
      localStorage.setItem("theme", "light");
      modeBtn.textContent = "☀️ Light Mode";
    } else {
      localStorage.removeItem("theme");
      modeBtn.textContent = "🌙 Dark Mode";
    }
  });
</script>
