<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Orders</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ===== Dark Mode (Default) ===== */
body {
    font-family: 'Poppins', Arial, sans-serif;
    padding: 20px;
    background: #0e0d0d; 
    color: #f1a887; 
    transition: all 0.3s;
}
h1 { 
    color: #f1a887; 
    text-shadow: 0 0 8px rgba(241,168,135,0.4); 
    margin-bottom: 15px; 
}
.top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 10px;
}
#searchInput {
    padding: 12px;
    width: 260px;
    border-radius: 10px;
    border: 1px solid #f1a887;
    background: #1a1a1a;
    color: #f1a887;
}
#searchInput::placeholder { color: #f1a88788; }
button {
    padding: 12px 18px;
    background: transparent;
    color: #f1a887;
    border: 2px solid #f1a887;
    cursor: pointer;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s;
}
button:hover { background: #f1a887; color: #0e0d0d; }
table {
    width: 100%;
    border-collapse: collapse;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(241,168,135,0.3);
}
th {
    background: #1c1c1c;
    color: #f1a887;
    padding: 15px;
    border-bottom: 2px solid #f1a88755;
    cursor: pointer;
    text-align: left;
}
td {
    padding: 14px;
    border-bottom: 1px solid #ffffff15;
    color: #fff;
    vertical-align: top;
}
tr:hover td { background: #f1a88715; }
.tag {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 5px;
    color: #0e0d0d;
}
.pickup { background: #c8efc8; }
.delivery { background: #f7d1a2; }
.delete-btn { background: #b60000; color: white; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;}
.delete-btn:hover { background: #ff0000; }

/* ===== Light Mode ===== */
body.light-mode {
    background: #fdf6e3;
    color: #333;
}
body.light-mode h1 { color: #d99b4b; text-shadow: none; }
body.light-mode #searchInput { background: #fff; border: 1px solid #d99b4b; color: #333; }
body.light-mode button { color: #d99b4b; border: 2px solid #d99b4b; }
body.light-mode button:hover { background: #d99b4b; color: #fff; }
body.light-mode table { background: #fff; box-shadow: 0 0 25px rgba(217,155,75,0.3); }
body.light-mode th { background: #f7f3eb; color: #d99b4b; border-bottom: 2px solid #d99b4b55; }
body.light-mode td { color: #333; border-bottom: 1px solid #00000015; }
body.light-mode tr:hover td { background: #ffe9c1; }
body.light-mode .pickup { background: #a5d6a7; color: #333; }
body.light-mode .delivery { background: #fdd692; color: #333; }
body.light-mode .delete-btn { background: #b60000; color: #fff; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .top-bar { flex-direction: column; align-items: flex-start; }
    #searchInput { width: 100%; }
}
@media (max-width: 480px) {
    table, thead, tbody, th, td, tr { display: block; }
    tr { margin-bottom: 15px; }
    th { display: none; }
    td {
        display: flex;
        justify-content: space-between;
        padding: 8px;
    }
    td::before { content: attr(data-label); font-weight: bold; flex: 1; }
    .delete-btn { width: 100%; margin-top: 5px; }
}
</style>
</head>

<body>
<h1>📦 Admin Order Dashboard</h1>

<div class="top-bar">
    <input type="text" id="searchInput" placeholder="Search name, phone, email...">
    <div style="display:flex; gap:10px; align-items:center;">
        <span id="modeToggle" style="cursor:pointer; font-size:24px;">🌙</span>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<table id="ordersTable">
  <thead>
    <tr>
      <th onclick="sortByDate()">Date ⬍</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Method</th>
      <th>Address</th>
      <th>Product</th>
      <th>Qty</th>
      <th>Total ($)</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="ordersBody">
    <tr><td colspan="9" style="text-align:center;">Loading orders...</td></tr>
  </tbody>
</table>

<script>
// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyAeo2ry4ZoTdsS3GUCbzhn-mcJ4LZSDCaM",
    authDomain: "new-look-61e6a.firebaseapp.com",
    projectId: "new-look-61e6a",
    storageBucket: "new-look-61e6a.appspot.com",
    messagingSenderId: "301307363622",
    appId: "1:301307363622:web:6e2a11445b37975523c1e7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Admin check
if (localStorage.getItem("adminLoggedIn") !== "yes") window.location.href = "admin-login.html";

let orders = [];
let dateSortDirection = -1;

// Logout
function logout() {
    localStorage.removeItem("adminLoggedIn");
    window.location.href = "admin-login.html";
}

// Light/Dark mode toggle
const modeToggle = document.getElementById("modeToggle");
modeToggle.addEventListener("click", ()=>{
    document.body.classList.toggle("light-mode");
    modeToggle.textContent = document.body.classList.contains("light-mode") ? "☀️" : "🌙";
});

// Render orders
function renderOrders(list = orders) {
    const tbody = document.getElementById("ordersBody");
    tbody.innerHTML = "";

    if(list.length===0){
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">No orders found</td></tr>`;
        return;
    }

    list.forEach(order=>{
        const deliveryTag = order.deliveryType
            ? `<span class="tag ${order.deliveryType==='pickup'?'pickup':'delivery'}">${order.deliveryType}</span>`
            : "-";

        let itemsHTML="-", totalQty=0;
        if(order.items && Array.isArray(order.items)){
            itemsHTML = order.items.map(i=>`${i.name} (x${i.quantity})`).join("<br>");
            totalQty = order.items.reduce((sum,i)=>sum+i.quantity,0);
        } else if(order.itemName){
            itemsHTML = `${order.itemName} (x${order.quantity||1})`;
            totalQty = order.quantity||1;
        }

        let dateStr="-";
        if(order.date){
            try{
                const d = order.date.toDate ? order.date.toDate() : new Date(order.date);
                dateStr = d.toLocaleString();
            }catch(e){ dateStr = order.date; }
        }

  const total = order.total ? `$${Number(order.total).toFixed(2)}` : "-";

        tbody.innerHTML += `
            <tr>
                <td data-label="Date">${dateStr}</td>
                <td data-label="Name">${order.customerName||"-"}</td>
                <td data-label="Phone">${order.customerPhone||"-"}</td>
                <td data-label="Method">${deliveryTag}</td>
                <td data-label="Address">${order.customerAddress||"-"}</td>
                <td data-label="Product">${itemsHTML}</td>
                <td data-label="Qty">${totalQty}</td>
                <td data-label="Total">${total}</td>
                <td data-label="Action"><button class="delete-btn" onclick="deleteOrder('${order.id}')">Delete</button></td>
            </tr>
        `;
    });
}

// Delete order
function deleteOrder(orderId){
    if(confirm("Delete this order?")){
        db.collection("orders").doc(orderId).delete()
          .then(()=>console.log("Order deleted"))
          .catch(err=>console.error(err));
    }
}

// Sort by date
function sortByDate(){
    orders.sort((a,b)=>{
        const aDate = a.date ? (a.date.toDate ? a.date.toDate() : new Date(a.date)) : new Date(0);
        const bDate = b.date ? (b.date.toDate ? b.date.toDate() : new Date(b.date)) : new Date(0);
        return dateSortDirection*(aDate - bDate);
    });
    dateSortDirection*=-1;
    renderOrders();
}

// Search
document.getElementById("searchInput").addEventListener("input", function(){
    const q=this.value.toLowerCase();
    const filtered = orders.filter(o=>
        (o.customerName||"").toLowerCase().includes(q) ||
        (o.customerPhone||"").toLowerCase().includes(q) ||
        (o.payerEmail||"").toLowerCase().includes(q)
    );
    renderOrders(filtered);
});

// Fetch orders from Firebase
db.collection("orders").onSnapshot(snapshot=>{
    orders = snapshot.docs.map(doc=>({id:doc.id, ...doc.data()}));
    renderOrders();
}, err=>console.error("Error fetching orders:", err));
</script>
</body>
</html>
